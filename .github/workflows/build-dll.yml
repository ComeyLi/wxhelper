name: Build wxhelper.dll (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - "fix-**"
      - "dev-3.9.5.81"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout (含 spdlog 子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 vcpkg 依赖 (nlohmann-json, detours)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "1de2026f28ead93ff1773e6e680387643e914ea1"

      - name: 安装编译所需的 vcpkg 包
        run: ${{ env.VCPKG_ROOT }}/vcpkg.exe install nlohmann-json:x64-windows detours:x64-windows

      - name: Configure (CMake + Visual Studio 2022 / x64)
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_MANIFEST_MODE=OFF

      - name: Build (Release)
        run: cmake --build build --config Release --target wxhelper

      - name: 上传产物 wxhelper.dll
        uses: actions/upload-artifact@v4
        with:
          name: wxhelper-dll-x64-${{ github.sha }}
          path: |
            build/lib/**/wxhelper.dll
            build/lib/**/wxhelper.pdb
          if-no-files-found: error
