name: Build wxhelper.dll (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - "fix-**"
      - "dev-3.9.5.81"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout (含 spdlog 子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 MSVC 开发环境 (cl.exe / ml64.exe / link.exe 等加入 PATH)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 vcpkg 依赖 (nlohmann-json, detours)
        # 之前固定的 vcpkg commit 里，nlohmann-json portfile 依赖的
        # msys2 pkgconf 包在所有镜像上都已 404（版本太旧被下架）。
        # run-vcpkg 要求显式指定 baseline commit（经典模式没有 vcpkg.json），
        # 这里用 vcpkg master 上较新的 commit，其 port 脚本里的包版本号
        # 已更新、镜像仍可下载。
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "75672db6bd812b060482b0f00b5a16b18a0c0f07"

      - name: 安装编译所需的 vcpkg 包
        # lukka/run-vcpkg 默认会尝试用 GitHub Actions 缓存做二进制缓存源，
        # 但缺少 ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL 会直接报错退出。
        # 这里关掉二进制缓存（clear），只走普通编译安装即可。
        run: ${{ env.VCPKG_ROOT }}/vcpkg.exe install nlohmann-json:x64-windows detours:x64-windows
        env:
          VCPKG_BINARY_SOURCES: clear

      - name: Configure (CMake + Ninja，在 MSVC 开发者环境下直接调用 cl.exe)
        # 之前用 "Visual Studio 17 2022" 生成器时，CMakeLists.txt 里的
        # CMAKE_CXX_STANDARD 17（以及命令行传入的 CMAKE_CXX_FLAGS）都没有
        # 正确透传成 cl.exe 的 /std:c++17，导致 <optional> 报错。
        # 换成 Ninja 生成器后 CMake 会直接拼出 cl.exe 命令行，标准选项
        # 能正确生效，绕开 MSBuild 那层属性映射的问题。
        shell: cmd
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_MANIFEST_MODE=OFF

      - name: Build (Release)
        shell: cmd
        run: cmake --build build --target wxhelper

      - name: 上传产物 wxhelper.dll
        uses: actions/upload-artifact@v4
        with:
          name: wxhelper-dll-x64-${{ github.sha }}
          path: |
            build/lib/**/wxhelper.dll
            build/lib/**/wxhelper.pdb
          if-no-files-found: error
