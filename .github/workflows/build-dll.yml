name: Build wxhelper.dll (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - "fix-**"
      - "dev-3.9.5.81"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout (含 spdlog 子模块)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 vcpkg 依赖 (nlohmann-json, detours)
        # 不锁定 vcpkg commit：之前固定的版本里 nlohmann-json portfile
        # 依赖的 msys2 pkgconf 包在所有镜像上都已 404，用最新 vcpkg 的
        # port 脚本（版本号更新过、镜像可用）来规避这个问题。
        uses: lukka/run-vcpkg@v11

      - name: 安装编译所需的 vcpkg 包
        # lukka/run-vcpkg 默认会尝试用 GitHub Actions 缓存做二进制缓存源，
        # 但缺少 ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL 会直接报错退出。
        # 这里关掉二进制缓存（clear），只走普通编译安装即可。
        run: ${{ env.VCPKG_ROOT }}/vcpkg.exe install nlohmann-json:x64-windows detours:x64-windows
        env:
          VCPKG_BINARY_SOURCES: clear

      - name: Configure (CMake + Visual Studio 2022 / x64)
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_MANIFEST_MODE=OFF

      - name: Build (Release)
        run: cmake --build build --config Release --target wxhelper

      - name: 上传产物 wxhelper.dll
        uses: actions/upload-artifact@v4
        with:
          name: wxhelper-dll-x64-${{ github.sha }}
          path: |
            build/lib/**/wxhelper.dll
            build/lib/**/wxhelper.pdb
          if-no-files-found: error
